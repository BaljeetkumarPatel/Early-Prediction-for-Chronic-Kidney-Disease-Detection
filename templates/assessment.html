<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKD Risk Assessment</title>
    <!-- <link rel="stylesheet" href="assessment.css"> -->
     <link rel="stylesheet" href="{{ url_for('static', filename='assessment.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="assessment-form-container card">
        <form action="/predict" method="POST">
            <h2>CKD Risk Assessment</h2>
            <p>Please fill out the fields below for a preliminary analysis.</p>
            <p>Please enter your detail as per your test report</p>

            <div class="form-group">
                <label for="bu"><i class="fas fa-hourglass-half"></i> Enter Your Blood Urea Level</label>
                <input type="number" id="bu" name="bu" placeholder="e.g., 55" required>
            </div>

            <div class="form-group">
                <label for="bgr"><i class="fas fa-heartbeat"></i> Enter your Blood Glucose Random Level</label>
                <input type="number" id="bgr" name="bgr" placeholder="e.g., 140 (the top number)" required>
            </div>

            <div class="form-group">
                <label for="ane"><i class="fas fa-tint"></i> Do you have deficiency of Anemia</label>
                <select id="ane" name="ane">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cad"><i class="fas fa-users"></i>Do you have Coronary Artery Disease</label>
                <select id="cad" name="cad">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pc"><i class="fas fa-smoking"></i> Please select your pus cell status</label>
                <select id="pc" name="pc">
                    <option value="0">Normal</option>
                    <option value="1">Abnormal</option>
                </select>
            </div>

            <div class="form-group">
                <label for="rbc"><i class="fas fa-smoking"></i> Please Select your RBC status (as per your test report)</label>
                <select id="rbc" name="rbc">
                    <option value="0">Normal</option>
                    <option value="1">Abnormal</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dm"><i class="fas fa-smoking"></i> Do you have Diabetes Mellitus</label>
                <select id="dm" name="dm">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pe"><i class="fas fa-smoking"></i> Do you have Pedal Edema (swelling in the feet or ankles)</label>
                <select id="pe" name="pe">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">
                Analyze My Risk
            </button>
        </form>
    </div>

    <a href="home.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>
        // This adds the "cta-box" class to our form so the JS selector finds it.
        // Make sure your script.js includes '.cta-box' in its querySelectorAll
        document.querySelector('.assessment-form-container').classList.add('cta-box');
    </script>
</body>
</html>
